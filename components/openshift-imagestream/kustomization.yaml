apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Registro interno de OpenShift / ROSA. Los Deployment referencian "orders-service:1.0.0" sin
# registro; con lookupPolicy.local el clúster resuelve ese nombre al ImageStream del proyecto.
# Sustituye al paso imperativo `oc set image-lookup`. Es un recurso de borde que se agrega; no
# modifica la base.
resources:
  - imagestreams.yaml
