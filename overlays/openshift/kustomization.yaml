apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Developer Sandbox de OpenShift: oc apply -k overlays/openshift
# Las imágenes se resuelven por ImageStream del proyecto (ver README).
resources:
  - ../../base
  - ../../platform

components:
  - ../../components/openshift-route

images:
  - name: orders-service
    newName: orders-service
    newTag: 1.0.0
  - name: inventory-service
    newName: inventory-service
    newTag: 1.0.0
