apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ARO (OpenShift en Azure) con servicios administrados: Azure Container Registry,
# Azure Database for PostgreSQL y Event Hubs (API de Kafka).
# Guía: docs/azure/README.md. Reemplazar cada <...> antes de aplicar:
#   oc apply -k overlays/aro-azure
resources:
  - ../../base

components:
  - ../../components/openshift-route

images:
  - name: orders-service
    newName: "<ACR_NAME>.azurecr.io/orders-service"
    newTag: 1.0.0
  - name: inventory-service
    newName: "<ACR_NAME>.azurecr.io/inventory-service"
    newTag: 1.0.0

replicas:
  - name: orders-service
    count: 2
  - name: inventory-service
    count: 2

patches:
  - path: config-values.yaml
