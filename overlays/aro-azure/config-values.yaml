# Endpoints de los servicios administrados. Las credenciales NO van aquí: van en secrets.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-service-config
data:
  DB_URL: "jdbc:postgresql://<PG_SERVER>.postgres.database.azure.com:5432/ordersapp?sslmode=require"
  KAFKA_BOOTSTRAP_SERVERS: "<EVENTHUBS_NAMESPACE>.servicebus.windows.net:9093"
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_MECHANISM: PLAIN
  LOG_LEVEL: INFO
  OUTBOX_BATCH_SIZE: "200"
---
