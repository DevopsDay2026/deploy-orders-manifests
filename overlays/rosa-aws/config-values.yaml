# Endpoints de los servicios administrados. Las credenciales NO van aquí: van en secrets.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-service-config
data:
  DB_URL: "jdbc:postgresql://<RDS_ENDPOINT>:5432/ordersapp?sslmode=require"
  KAFKA_BOOTSTRAP_SERVERS: "<MSK_BOOTSTRAP_SCRAM>"   # puerto 9096 (SASL/SCRAM sobre TLS)
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  LOG_LEVEL: INFO
  OUTBOX_BATCH_SIZE: "200"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-service-config
data:
  DB_URL: "jdbc:postgresql://<RDS_ENDPOINT>:5432/ordersapp?sslmode=require"
  KAFKA_BOOTSTRAP_SERVERS: "<MSK_BOOTSTRAP_SCRAM>"
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  LOG_LEVEL: INFO
  OUTBOX_BATCH_SIZE: "200"
