apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ROSA en AWS con servicios administrados: Amazon ECR, Amazon RDS y Amazon MSK.
# Guía: docs/aws/README.md. Reemplazar cada <...> antes de aplicar:
#   oc apply -k overlays/rosa-aws
# Sin ../../platform (las bases y Kafka vienen de AWS) y sin ImageStream (se tira directo de ECR).
resources:
  - ../../base

components:
  - ../../components/openshift-route

images:
  - name: orders-service
    newName: "<ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/orders-service"
    newTag: 1.0.0
  - name: inventory-service
    newName: "<ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/inventory-service"
    newTag: 1.0.0

replicas:
  - name: orders-service
    count: 2
  - name: inventory-service
    count: 2

patches:
  - path: config-values.yaml
