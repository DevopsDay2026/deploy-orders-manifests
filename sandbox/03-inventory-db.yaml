# Generado por sandbox/render.py desde overlays/openshift. No editar a mano.
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: orders-app
  name: inventory-db
spec:
  ports:
  - name: postgresql
    port: 5432
    targetPort: 5432
  selector:
    app.kubernetes.io/name: inventory-db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: orders-app
  name: inventory-db-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: orders-app
  name: inventory-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: platform
        app.kubernetes.io/name: inventory-db
        app.kubernetes.io/part-of: orders-app
    spec:
      containers:
      - env:
        - name: POSTGRESQL_DATABASE
          value: inventory
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              key: DB_USERNAME
              name: inventory-service-secrets
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: inventory-service-secrets
        image: quay.io/sclorg/postgresql-16-c9s:20260930
        name: postgresql
        ports:
        - containerPort: 5432
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /var/lib/pgsql/data
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: inventory-db-data
