# Plantilla de los Secret que leen los servicios y sus bases de datos.
#   cp secrets.example.yaml secrets.yaml   (secrets.yaml está ignorado por git)
#   reemplazar cada <...> y aplicar:
#     Podman:     podman kube play secrets.yaml
#     OpenShift:  oc apply -f secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: orders-service-secrets
type: Opaque
stringData:
  DB_USERNAME: "<usuario-bd-orders>"
  DB_PASSWORD: "<password-bd-orders>"
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-service-secrets
type: Opaque
stringData:
  DB_USERNAME: "<usuario-bd-inventory>"
  DB_PASSWORD: "<password-bd-inventory>"
