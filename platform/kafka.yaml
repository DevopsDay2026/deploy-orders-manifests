apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
data:
  KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      containers:
        - name: kafka
          image: quay.io/strimzi/kafka:0.45.0-kafka-3.9.0
          command:
            - sh
            - -c
            # log.dirs apunta a un subdirectorio del volumen: la raíz de un PV ext4 trae lost+found
            # y Kafka aborta al intentar cargarlo como partición
            - >-
              sed 's#^log.dirs=.*#log.dirs=/var/lib/kafka/data#' config/kraft/server.properties
              > /tmp/server.properties &&
              bin/kafka-storage.sh format --ignore-formatted
              -t "$(bin/kafka-storage.sh random-uuid)"
              -c /tmp/server.properties &&
              exec bin/kafka-server-start.sh /tmp/server.properties
              --override advertised.listeners="${KAFKA_ADVERTISED_LISTENERS}"
          envFrom:
            - configMapRef:
                name: kafka-config
          env:
            - name: LOG_DIR
              value: /tmp/logs
            # el script arranca con -Xmx1G si no se define; debe caber en resources.limits.memory
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
          ports:
            - containerPort: 9092
          volumeMounts:
            # con volumen, tópicos y offsets sobreviven al reinicio del pod (el Sandbox los
            # elimina cada 12 h)
            - name: data
              mountPath: /var/lib/kafka
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kafka-data
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
