apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dependencias de la aplicación para entornos sin servicios administrados
# (laptop con Podman y Developer Sandbox de OpenShift): PostgreSQL por servicio y Kafka de un nodo.
labels:
  - pairs:
      app.kubernetes.io/part-of: orders-app
      app.kubernetes.io/component: platform
    includeTemplates: true

resources:
  - orders-db.yaml
  - inventory-db.yaml
  - kafka.yaml
