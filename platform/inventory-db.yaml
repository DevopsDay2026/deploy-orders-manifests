apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inventory-db-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-db
    spec:
      containers:
        - name: postgresql
          image: quay.io/sclorg/postgresql-16-c9s:20260930
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              value: inventory
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: inventory-service-secrets
                  key: DB_USERNAME
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-service-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: inventory-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-db
spec:
  selector:
    app.kubernetes.io/name: inventory-db
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
